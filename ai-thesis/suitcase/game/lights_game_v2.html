<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seven days</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

var DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

  ['…you won\'t believe it, there\'s a girl upstairs…', '…she doesn\'t talk much, does she?…', '…what is she doing up there all day?…', '…cultural background… completely different…'],

  ['Don\'t go into her room again.', 'What do I do? I already told the child not to go into her room.', 'She\'s so smart. I didn\'t even know opening a door could be recorded.', 'I can\'t lose this income.', 'I\'m so busy at work. I really don\'t want to deal with this.', 'I didn\'t think she\'d actually tell Mom.', 'She looked easy to push around.', 'Why don\'t you go play at your friend\'s house today?', '…she\'s a… liar…'],
  ['Listen up. We\'re a family. We stick together.', 'You must be mistaken.', 'Going into her room? That never happened.', 'It\'s just talking. It\'s not a big deal.', 'This is my house.'],
  ['I\'m in my own room.', 'She has moved out at last.', 'Another guest will come.']

var TINTS = ['rgba(255,200,150,0.0)', 'rgba(150,190,255,0.08)', 'rgba(255,170,150,0.08)', 'rgba(190,150,255,0.10)', 'rgba(150,255,200,0.07)', 'rgba(255,230,150,0.08)', 'rgba(120,120,140,0.20)'];

window.addEventListener('resize', resize); resize();
function now() { return performance.now() / 1000; }

var dayImg = [];

var FC = document.createElement('canvas'); FC.width = FC.height = 512; var fc = FC.getContext('2d');

var strips = [], stripT = 0;

// ===== 声音 =====

cv.addEventListener('pointermove', function (e) { if (!cam.on) { hand.x = e.clientX; hand.y = e.clientY; hand.seen = now(); } });
// ===== 麦克风拍手 =====
var mic = { on: false, an: null, buf: null, last: 0, prev: 0, level: 0, msg: '' };
function startMic() {

// ===== 游戏状态 =====

var dot = null, flash = { scale: 1, t0: -9, tx: 0, ty: 0, hit: false, center: null };
var flyers = [], rings = [], sentence = '', typed = 0, sentT = 0, lit = [false, false, false, false, false, false, false], fade = 1, jarPulse = 0;
function newDay() {
  var m = 0.16; dot = { u: rnd(m, 1 - m), v: rnd(0.2, 1 - m), found: false };
  dayStart = now(); state = 'search'; stateT = now(); sentence = '';
}
newDay();
function jarPos() { return { x: Math.max(70, HW * 0.12), y: H - 110 }; }

function flashR() { return RS * FLASH_R; }
function doClap() {

}
window.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();

  if (k === 'c') startCam();
  if (k === 'k') startMic();
  if (k === 'h') window.showDot = !window.showDot;

});
cv.addEventListener('pointerdown', function () { audio(); doClap(); });
function foundDot() {

var lastT = now();
function frame() { try { inner(); } catch (e) { console.error(e); } requestAnimationFrame(frame); }

  cx.font = '13px ui-monospace, Menlo, monospace'; cx.textAlign = 'left'; cx.fillStyle = 'rgba(255,170,150,0.8)';

  if (mic.on) { cx.fillStyle = 'rgba(210,220,235,0.4)'; cx.fillRect(HW - 60, H - 14, 120, 4); cx.fillStyle = 'rgba(255,225,150,0.8)'; cx.fillRect(HW - 60, H - 14, Math.min(120, mic.level * 120 / CLAP_THRESH * 0.6), 4); }
  if (muted) { cx.fillStyle = 'rgba(210,215,230,0.5)'; cx.textAlign = 'right'; cx.fillText('muted (M)', W - 16, H - 16); }
}
requestAnimationFrame(frame);
</script>
