</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== 可以改的设置 =====
var MODE = 'wave';            // 'wave' = 挥手：手动得越多，光点越被吸过来，碰到光圈就被收走（只需要挥手，不需要任何手势）；'grab' = 聚拢后握拳；'lasso' = 画圈。运行时按 W / G / L 切换

var MAX_DOTS = 9;             // 左边同时飘几个光点

var DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

  ['She has gone out!', 'The door is open. Just a little.', 'Let me go in. Just a quick look.', '…I\'m in her room… right now…', 'Going through her trash…', '…look at these photos… sending them to my friends…'],
  ['The bell rang.', 'It kept ringing. It wouldn\'t stop.', 'Then the bell stopped.', 'Someone was in my room.'],
  ['Don\'t go into her room again.', 'What do I do? I already told the child not to go into her room.', 'She\'s so smart. I didn\'t even know opening a door could be recorded.', 'I can\'t lose this income.', 'I\'m so busy at work. I really don\'t want to deal with this.', 'I didn\'t think she\'d actually tell Mom.', 'She looked easy to push around.', 'Why don\'t you go play at your friend\'s house today?', '…everyone, come on… tonight I\'ll tell you all about… the girl living in my house…', '…she\'s a… liar…'],
  ['Listen up. We\'re a family. We stick together.', 'You must be mistaken.', 'Going into her room? That never happened.', 'It\'s just talking. It\'s not a big deal.', 'This is my house.'],
  ['I\'m in my own room.', 'She has moved out at last.', 'Another guest will come.']

// ===== 画布 =====
var cv = document.getElementById('c'), cx = cv.getContext('2d');
var W = 0, H = 0, dpr = 1, HW = 0;
function resize() {

window.addEventListener('resize', resize); resize();
var roomImg = new Image(); roomImg.src = 'bedroom_sims_sq_noui.png';

var cam = { on: false, video: null, off: null, octx: null, prev: null, mask: null, cw: 80, ch: 60, mass: 0, mx: 0, my: 0, msg: '' };

// ===== 声音 =====
var AC = null, muted = false;

var SCALE = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3];

function stuckBell() { var t = 0; for (var i = 0; i < 16; i++) { ding(t); t += 0.12 + Math.random() * 0.22; } }
// ===== 状态 =====
var dots = [], flyers = [], trail = [], fadeTrails = [];
var count = 0, week = 1, jarPulse = 0, hintAlpha = 1, state = 'play';
var rel = null;   // 释放阶段的数据
function rnd(a, b) { return a + Math.random() * (b - a); }
function jarPos() { return { x: Math.max(70, HW * 0.12), y: H - 110 }; }
function spawnDot() {
  var m = 70, jp = jarPos(), tries = 0, x, y;
  do { x = rnd(m, HW - m); y = rnd(m + 40, H - m); tries++; } while (tries < 20 && Math.hypot(x - jp.x, y - jp.y) < 150);
  dots.push({ x: x, y: y, vx: rnd(-20, 20), vy: rnd(-20, 20), ang: rnd(0, 6.28), ph: rnd(0, 6.28), r: rnd(7, 11), born: now(), life: rnd(DOT_LIFE[0], DOT_LIFE[1]), caught: false, a: 0 });
}
function now() { return performance.now() / 1000; }
var rings = [];
function addRing(x, y) { rings.push({ x: x, y: y, t0: now() }); }
var mouse = { x: -999, y: -999 }, handSpeed = 0, fistT = -9, lastMove = 0, lastMX = -999, lastMY = -999;
// ===== 画圈 =====

  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function area(poly) { var s = 0; for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) s += (poly[j].x + poly[i].x) * (poly[j].y - poly[i].y); return Math.abs(s / 2); }

  if (Math.abs(d) < 1e-9) return null;
  var t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  var u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };

}
function catchInside(poly) {
  if (state !== 'play' || poly.length < 3 || area(poly) < 600) return;
  var n = 0, jp = jarPos();
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    if (!d.caught && inPoly(d.x, d.y, poly)) {
      d.caught = true; n++; addRing(d.x, d.y);
      flyers.push({ x: d.x, y: d.y, sx: d.x, sy: d.y, tx: jp.x, ty: jp.y, t0: now() + n * 0.08, dur: 0.75, kind: 'jar', r: d.r });

}
var drawing = false;
function grabAt(x, y) {
  if (state !== 'play') return;
  var n = 0, jp = jarPos(); fistT = now();
  var near = dots.filter(function (q) { return !q.caught && Math.hypot(q.x - x, q.y - y) < GRAB_R; });
  near.sort(function (a, b) { return Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y); });

    var d = near[i];

      flyers.push({ x: d.x, y: d.y, sx: d.x, sy: d.y, tx: jp.x, ty: jp.y, t0: now() + n * 0.08, dur: 0.75, kind: 'jar', r: d.r });

cv.addEventListener('pointerdown', function (e) { audio(); if (MODE === 'wave') return; if (MODE === 'grab') { mouse.x = e.clientX; mouse.y = e.clientY; grabAt(e.clientX, e.clientY); return; } drawing = true; trail = [{ x: e.clientX, y: e.clientY }]; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
cv.addEventListener('pointermove', function (e) {

  mouse.x = e.clientX; mouse.y = e.clientY;
  if (!drawing) return;
  var last = trail[trail.length - 1];
  if (Math.hypot(e.clientX - last.x, e.clientY - last.y) < 5) return;
  var p = { x: e.clientX, y: e.clientY };
  trail.push(p);
  var n = trail.length;
  if (n > 8) {
    for (var i = 0; i < n - 4; i++) {
      var hit = segInter(trail[n - 2], trail[n - 1], trail[i], trail[i + 1]);
      if (hit) {
        var poly = [hit].concat(trail.slice(i + 1, n - 1));
        catchInside(poly);
        fadeTrails.push({ pts: trail.slice(), t0: now() });
        trail = [p];
        return;
      }
    }
  }
});
function endDraw() {
  if (!drawing) return; drawing = false;
  if (trail.length > 10 && Math.hypot(trail[0].x - trail[trail.length - 1].x, trail[0].y - trail[trail.length - 1].y) < 70) catchInside(trail);
  if (trail.length > 1) fadeTrails.push({ pts: trail.slice(), t0: now() });
  trail = [];
}
cv.addEventListener('pointerup', endDraw); cv.addEventListener('pointercancel', endDraw);
window.addEventListener('keydown', function (e) {
  if (e.key === 'm' || e.key === 'M') muted = !muted;
  if (e.key === 'c' || e.key === 'C') startCam();
  if (e.key === 'w' || e.key === 'W') { MODE = 'wave'; trail = []; drawing = false; }
  if (e.key === 'g' || e.key === 'G') { MODE = 'grab'; trail = []; drawing = false; }
  if (e.key === 'l' || e.key === 'L') MODE = 'lasso';
  if ((e.key === 'r' || e.key === 'R') && state === 'play') { count = NEED; startRelease(); }
});
// ===== 释放：七个光点冲到右边，落进一周七天，再一天一天读出句子 =====
function pickWeek() {
  var s = POOL.map(function (p) { return p[Math.floor(Math.random() * p.length)]; });
  if (Math.random() < SWAP_CHANCE) { var t = s[2]; s[2] = s[3]; s[3] = t; }
  return s;
}
function cellPos(i) {

}
function startRelease() {

// ===== 画 =====

    cx.fillText(DAYS[c], cp.x, cp.y + 5);

    }

    var lines = wrapText(rel.text.slice(0, rel.typed), HW * 0.76), full = wrapText(rel.text, HW * 0.76), lh = FONT_PX * 1.35, y0 = H * 0.52 - (full.length - 1) * lh / 2;
    cx.fillStyle = 'rgba(210,215,230,0.55)'; cx.font = '15px ui-monospace, Menlo, monospace'; cx.fillText(DAYS[rel.idx], HW + HW / 2, y0 - FONT_PX * 1.2);
