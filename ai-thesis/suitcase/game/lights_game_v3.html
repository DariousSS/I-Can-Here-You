    if (window.showDot) a = Math.max(a, 0.5);
    if (a > 0.01) { cx.save(); cx.globalCompositeOperation = 'lighter'; glow(ds.x, ds.y, 9, a, 48); cx.restore(); }
  }
  // 收紧时的圆圈
  cx.save(); cx.globalCompositeOperation = 'lighter'; cx.lineWidth = 2;
  for (var ri = rings.length - 1; ri >= 0; ri--) { var rg = rings[ri], ru = (t - rg.t0) / 0.5; if (ru >= 1) { rings.splice(ri, 1); continue; } cx.strokeStyle = 'rgba(255,225,150,' + (0.85 * (1 - ru)) + ')'; cx.beginPath(); cx.arc(rg.x, rg.y, 70 * (1 - (1 - Math.pow(1 - ru, 2))) + 6, 0, 6.2832); cx.stroke(); }
  for (var k2 = flyers.length - 1; k2 >= 0; k2--) {
    var f = flyers[k2], fu = (t - f.t0) / f.dur; if (fu < 0) continue;
    if (fu >= 1) { count = Math.min(7, count + 1); jarPulse = 1; pianoNote(SCALE[day % 7], (week - 1) * 0.012); flyers.splice(k2, 1); continue; }
    var fe = fu < 0.5 ? 2 * fu * fu : 1 - Math.pow(-2 * fu + 2, 2) / 2;
    glow(f.sx + (f.tx - f.sx) * fe, f.sy + (f.ty - f.sy) * fe, 7, 1, 48);
  }
  cx.restore(); jarPulse = Math.max(0, jarPulse - dt * 3);
  // ---- 中间的墙 ----
  var g = cx.createLinearGradient(HW - 9, 0, HW + 9, 0); g.addColorStop(0, '#0b0b0d'); g.addColorStop(0.5, '#1a1a1e'); g.addColorStop(1, '#0b0b0d'); cx.fillStyle = g; cx.fillRect(HW - 9, 0, 18, H);
  drawJar();
  cx.fillStyle = 'rgba(220,225,235,0.8)'; cx.font = '16px ui-monospace, Menlo, monospace'; cx.textAlign = 'left'; cx.fillText('Week ' + week + '   ' + DAYS[Math.min(6, day)], 24, 34);
  // ---- 右边：日历 + 句子 ----
  for (var c = 0; c < 7; c++) {
    var cp = cellPos(c), lt = lit[c], curr = c === day && state === 'tell';
    cx.strokeStyle = lt ? 'rgba(255,225,150,0.95)' : (c === day ? 'rgba(210,215,230,0.5)' : 'rgba(180,190,210,0.28)'); cx.lineWidth = lt ? 2 : 1;
    cx.fillStyle = lt ? 'rgba(255,215,120,' + (curr ? 0.28 : 0.12) + ')' : 'rgba(255,255,255,0.02)';
    cx.beginPath(); cx.rect(cp.x - cp.w / 2, cp.y - cp.h / 2, cp.w, cp.h); cx.fill(); cx.stroke();
    cx.fillStyle = lt ? 'rgba(255,240,200,0.95)' : 'rgba(180,190,210,0.45)'; cx.font = '14px ui-monospace, Menlo, monospace'; cx.textAlign = 'center'; cx.fillText(DAYS[c], cp.x, cp.y + 5);
  }
  if (tell) {
    if (state === 'tell') {
      if (tell.n === 0 && t - tell.t0 > TELL_FIRST) addTold(SENT[Math.floor(Math.random() * SENT.length)]);
      var lastI = tell.told.length ? tell.told[tell.told.length - 1] : null;
      if (lastI) {
        var doneType = (t - lastI.t0) > lastI.text.length / TYPE_CPS;
        var over = tell.n >= TELL_MAX ? (t - lastI.t0 > lastI.text.length / TYPE_CPS + HOLD_SEC) : (t - tell.last > TELL_IDLE);
        if (doneType && over) { if (day >= 6) { state = 'end'; stateT = t; } else { day++; newDay(); tell = null; } }
      }
    }
  }
  if (tell) {
    cx.font = FONT_PX + 'px -apple-system, "Helvetica Neue", Arial, sans-serif'; cx.textAlign = 'center';
    var lh = FONT_PX * 1.35, maxLines = Math.floor(H * 0.58 / lh), blocks = [], total = 0;
    for (var ti = tell.told.length - 1; ti >= 0; ti--) {
      var it = tell.told[ti], tn = Math.min(it.text.length, Math.floor((t - it.t0) * TYPE_CPS)), fl = wrapText(it.text, HW * 0.76).length;
      if (total + fl > maxLines && blocks.length) break;
      blocks.unshift({ lines: wrapText(it.text.slice(0, tn), HW * 0.76), age: tell.told.length - 1 - ti }); total += fl;
    }
    var y0 = H * 0.30;
    cx.fillStyle = 'rgba(210,215,230,0.55)'; cx.font = '15px ui-monospace, Menlo, monospace'; cx.fillText(DAYS[Math.min(6, day)], HW + HW / 2, y0 - 22);
    cx.font = FONT_PX + 'px -apple-system, "Helvetica Neue", Arial, sans-serif';
    var yy = y0;
    for (var bi = 0; bi < blocks.length; bi++) { cx.fillStyle = blocks[bi].age === 0 ? '#fff' : 'rgba(255,255,255,0.5)'; for (var ln = 0; ln < blocks[bi].lines.length; ln++) { cx.fillText(blocks[bi].lines[ln], HW + HW / 2, yy); yy += lh; } }
    if (state === 'tell' && tell.n === 0 && t > tell.t0) { cx.fillStyle = 'rgba(255,225,150,' + (0.5 + 0.4 * Math.sin(t * 4)) + ')'; cx.font = '18px ui-monospace, Menlo, monospace'; cx.fillText('Press a key.', HW + HW / 2, H * 0.52); }
  }
  if (state === 'end') {
    var fa = Math.max(0, Math.min(1, (t - stateT - 2.2) / 1.2)); cx.fillStyle = 'rgba(0,0,0,' + fa + ')'; cx.fillRect(HW + 9, 0, HW, H);
    if (t - stateT > 3.6) { day = 0; week++; count = 0; lit = [false, false, false, false, false, false, false]; tell = null; newDay(); }
  }
  // ---- 提示和状态 ----
  var hint = day === 0 && state === 'search' && t - dayStart < 20 && count === 0;
  if (hint) { cx.fillStyle = 'rgba(210,215,230,0.6)'; cx.font = '16px -apple-system, Arial, sans-serif'; cx.textAlign = 'center'; cx.fillText(cam.on ? 'Move your hand like a flashlight. Clap when you find a light. Then press piano keys.' : 'Move like a flashlight. Click or press Space when you find a light. Then press keys (1 2 3 ... q w e ...).', HW / 2, H - 28); }
  cx.font = '13px ui-monospace, Menlo, monospace'; cx.textAlign = 'left'; cx.fillStyle = 'rgba(255,170,150,0.8)';
  if (cam.msg) cx.fillText(cam.msg, 24, H - 16); else if (mic.msg) cx.fillText(mic.msg, 24, H - 16); else if (midi.msg) cx.fillText(midi.msg, 24, H - 16);
  if (t - searchHint < 1.6 && state === 'search') { cx.textAlign = 'center'; cx.fillStyle = 'rgba(210,215,230,0.6)'; cx.font = '15px -apple-system, Arial, sans-serif'; cx.fillText('Find a light first.', HW + HW / 2, H * 0.52); }
  if (mic.on) { cx.fillStyle = 'rgba(210,220,235,0.4)'; cx.fillRect(HW - 60, H - 14, 120, 4); cx.fillStyle = 'rgba(255,225,150,0.8)'; cx.fillRect(HW - 60, H - 14, Math.min(120, mic.level * 120 / CLAP_THRESH * 0.6), 4); }
  if (muted) { cx.fillStyle = 'rgba(210,215,230,0.5)'; cx.textAlign = 'right'; cx.fillText('muted (M)', W - 16, H - 16); }
}
requestAnimationFrame(frame);
startMidi();
</script>
